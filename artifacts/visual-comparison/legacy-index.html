  $('description').textContent=$('run').value==='final'?(finalPairs.generatedAt?'本轮来源按完成的原生捕获报告和Web快照SHA映射；浏览器API均为本地响应回放。原生认证4张独立，主组要求一次完整captured18，不合并中途未完成截图。主18配对、显式故障2组分别计数；原生IME不伪造浏览器键盘。display衬线固定同一Noto字节，正文系统字体、测试环境标识、只读开始动作等差异详见报告。':'当前登录图为12:54根offset构建复拍。主要控件y差0.024～0.579vp；两主题实际星形路径中心(311.407,186.370)vp，较391Web差(+0.407,+0.089)，完整绘制且不受story裁切。输入frame宽仍多1vp，环境徽标、栅格化及图标差异明示；不是全部状态像素一致结论。其余实际账号业务页面等待主快照。'):'此组用于记录修复前问题。原生来自首版未编辑截图；旧E2E数据与Web参考一致。它不代表本轮真实HTTPS构建的完成度。';
  document.querySelectorAll('#states button').forEach((b,i)=>b.setAttribute('aria-pressed',states[i][1]===s[1]));
}
states.forEach(s=>{const b=document.createElement('button');b.textContent=s[0];b.onclick=()=>pick(s);$('states').append(b)});
for(const id of ['run','webSource','area'])$(id).onchange=()=>pick(current);
