if(resume){$('captureRunNote').hidden=false;$('captureRunNote').textContent=resume.verified?'主捕获来源：从SHA核验的检查点保留'+resume.retainedCount+'张，另采'+resume.newExpectedCount+'张；不是单次不中断运行。':'检查点来源尚未验证，不计最终主捕获。'}
const extraSources=finalPairs.extraNativeEvidence||[];
if(extraSources.length){$('extraSources').hidden=false;$('extraSources').append(document.createTextNode('额外原生检查图：'));for(const item of extraSources){const link=document.createElement('a');link.href='../'+item.directory+'/'+item.file;link.textContent=item.label;link.target='_blank';link.rel='noopener';$('extraSources').append(link)}}
if(finalPairs.generatedAt){$('paired-option').disabled=false;$('paired-option').textContent='本轮逐状态真实快照 · 391×777';$('webSource').value='paired'}else{$('webSource').value='loginContent'}
function pick(s){
  current=s;const run=runs[$('run').value],mapping=finalPairs.states[s[1]],paired=$('webSource').value==='paired';
  const source=paired?{width:391,label:'本轮对应状态的真实响应快照，本地回放'}:webSources[$('webSource').value];
  const legacyAvailable=!source.files||source.files.includes(s[1]);
  const webAvailable=paired?!!mapping?.web.available:legacyAvailable&&!(/^detail-(waiting|expired|locked|404-fault)-/.test(s[1])||s[1].startsWith('login-keyboard-'));
  $('wl').textContent='Web · '+s[0]+' · '+(paired&&mapping?.web.dataConsumption?mapping.web.dataConsumption:source.label);$('web').hidden=!webAvailable;$('webPending').hidden=webAvailable;$('webOriginal').hidden=!webAvailable;
  if(webAvailable){$('web').src='../'+(paired?mapping.web.directory+'/'+mapping.web.file:source.directory+'/'+s[1]+'.png');$('webOriginal').href=$('web').src}else{$('web').removeAttribute('src');$('webPending').textContent=paired?(mapping?.web.reason||'对应快照捕获尚未登记。'):'此参考组不包含所选状态；请切换对应快照组。'}$('webFrame').style.width=source.width+'px';$('web').style.width=source.width+'px';
  const nativeMapped=$('run').value==='final'&&finalPairs.generatedAt;
  const file=nativeMapped?(mapping?.native.available?mapping.native.file:null):run.files[s[1]];
  const captureLabel=nativeMapped?({'auth-system':'新版认证捕获','main-system':'新版完整业务捕获'}[mapping?.native.captureSource]||'待新版捕获'):'';
  $('nl').textContent=run.label+' · '+s[0]+(captureLabel?' · '+captureLabel:'')+(mapping?.native.keyboardFocus?' · 空账号焦点；系统IME采用设备自身主题':'');
  const metrics=nativeMapped?mapping?.native.window:($('run').value==='initial'?{widthPx:1320,heightPx:2848,density:3.375,topInsetPx:131,bottomInsetPx:94}:null);
  const content=!!metrics&&$('area').value==='content';$('area').disabled=!metrics;$('nativeFrame').classList.toggle('content',content);
  const nativeWidth=metrics?metrics.widthPx/metrics.density:390;$('nativeFrame').style.width=nativeWidth+'px';$('native').style.width=nativeWidth+'px';$('nativeFrame').style.height=content?(metrics.heightPx-metrics.topInsetPx-metrics.bottomInsetPx)/metrics.density+'px':'auto';$('native').style.transform=content?'translateY('+(-metrics.topInsetPx/metrics.density)+'px)':'none';
  $('viewportNote').textContent=metrics?'本图窗口 '+metrics.widthPx+'×'+metrics.heightPx+'px，density='+metrics.density+'，避让区top/bottom='+metrics.topInsetPx+'/'+metrics.bottomInsetPx+'px；'+(metrics.source?'实测来源record['+metrics.sourceRecord+']、SHA-256 '+metrics.sourceSha256+'。':'')+(content?'当前只对齐业务内容区，暂不显示系统栏；此模式不用于判断全窗口沉浸效果。':'当前展示完整原生屏幕及状态栏/手势区，用于查看全窗口材质连续性。')+'仅做CSS显示换算，原PNG不修改。官方容器的批准平台差异不按逐像素相等判定。':'新版窗口参数待记录；未提供时仅显示完整原图预览，不沿用旧图安全区作新版几何通过结论。';
  $('native').hidden=!file;$('pending').hidden=!!file;$('nativeOriginal').hidden=!file;
  if(file){$('native').src=nativeMapped?'../'+mapping.native.directory+'/'+file:'../'+(run.stateDirectories?.[s[1]]||run.directory)+'/'+file+'.png';$('nativeOriginal').href=$('native').src}else{$('native').removeAttribute('src');$('pending').textContent='此状态的最终证据尚未登记；不使用旧图或不同主题图替代。'}
  $('pairStatus').textContent=finalPairs.generatedAt?'新准则来源映射：主配对 '+finalPairs.counts.primaryPairs+'/18，显式404故障 '+finalPairs.counts.faultPairs+'/2，原生键盘 '+finalPairs.counts.nativeOnlyKeyboard+'/2。'+(paired&&mapping?.web.snapshotSha256?'Web参考输入SHA-256：'+mapping.web.snapshotSha256+'。':'')+'截图配对不等于官方材质、交互、动画或折叠适配已验收。':'新准则来源映射待生成；旧图仅作历史参考。';
  $('description').textContent=$('run').value==='final'?'只接纳最终edge-to-edge-v1 HAP与实测窗口SHA均匹配的完整捕获。旧系统UI图已归档，不计最终通过。Web API为本地快照回放；已批准官方顶栏材质、浮动底栏、Tab/Sheet/Toast及系统动效差异。首页同步句位于滚动内容最后，不保留固定占位块；系统栏/手势区采用全窗口材质背景，仅前景内容避让安全区。品牌、文案、业务状态和信息层级仍需对齐，未实现目的地不生成假页面。':'历史截图用于说明迁移过程；不计入官方ArkUI新版通过数量。';
  const evidence=finalPairs.runtimeEvidence,material=evidence?.runtime.materialAsRecorded,interactions=evidence?.interaction,bars=evidence?.runtime.systemBarsAsRecorded;
  $('runtimeStatus').textContent='独立运行证据：'+(interactions?.available?'交互检查 '+interactions.verifiedCheckCount+'/'+interactions.count+' 通过':'交互报告待验证')+'；'+(material?'设备材质支持='+material.supported+'，运行记录 state/type/level='+material.state+'/'+material.type+'/'+material.level:'材质运行记录待验证')+(bars?'；实际系统栏背景status/navigation='+bars.statusBarColor+'/'+bars.navigationBarColor+'，layout='+bars.immersiveLayout:'')+'。仅一台API26手机；减少动画、录制动效、读屏、折叠/悬停/分栏/窗口变化及强制材质降级需另有实测，截图不替代这些结论。';
  document.querySelectorAll('#states button').forEach((b,i)=>b.setAttribute('aria-pressed',states[i][1]===s[1]));

states.forEach(s=>{const b=document.createElement('button');b.textContent=s[0];b.onclick=()=>pick(s);$('states').append(b)});
for(const id of ['run','webSource','area'])$(id).onchange=()=>pick(current);
pick(current);
</script>
